[package]
name = "minted-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = """
Macros for the `minted` crate, providing procedural macros for serialization, deserialization, and other utilities related to the MINT format.
"""

[dependencies]
darling = "0.24.1"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.4"

[lib]
proc-macro = true

[features]
introspect = []
rpc = []
